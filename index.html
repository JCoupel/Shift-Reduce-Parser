<!doctype html>
<html lang="en">
    
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JS Shift Reduce Parser</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
  </head>

  <body class="text-center">

    <h1 class="title py-4">JS Shift Reduce Parser</h1>

    <div class="container main-content mb-3">
        <div class="sidebar">
            <div class="grammar-container mb-3">
                <h2 class="grammar-title">Production Rules</h2>
                <div class="grammar-editor-box">
                    <pre class="grammar-display">
E -> E + T
E -> T
T -> T * F
T -> F
F -> ( E )
F -> id</pre>
                </div>
                <div class="grammar-rule-list disabled"></div>
            </div>
            

            <div class="start-buttons mb-4">
                <div class="running-controls disabled">
                    <button type="button" class="btn btn-secondary" id="back-btn">&larr; Back</button>
                    <button type="button" class="btn btn-secondary" id="next-btn">Next &rarr;</button>
                    <button id="simulate-btn" class="btn btn-primary">Simulate</button>

                </div>
                <button type="button" class="btn btn-success" id="run-btn">Run</button>
            </div>

            <div class="input-container"><h2 class=>Input</h2>
                <textarea class="input-box mb-5" id="text-input" cols="60" rows="2">id + id * id$</textarea>
            </div>

            <div class="state-content">
                <div class="stack-container mb-3 disabled">
                    <span class="element-label">Stack:</span>
                    <div class="stack-list"></div>
                </div>
                <div class="tokens-container mb-3 disabled">
                    <span class="element-label">Tokens:</span>
                    <div class="tokens-list"></div>
                </div>
            </div>
        </div>

        <div class="right-content"><table class="parser-table"></table></div>
    </div>

    <script src="./generate-table.js"></script>
    <script src="./parser-logic.js"></script>

  </body>
</html>
